.c .nm{font-weight:900;font-size:var(--fs,14px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c .sb{font-weight:700;font-size:calc(var(--fs,14px)*.72);color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{cursor:default}.u .tx{bottom:4px;left:5px;right:5px}.u .nm{font-weight:700;color:var(--dim)}
.u.live{cursor:pointer;border-color:#5a5a62}.u.live .nm{color:var(--fg)}
.f{z-index:5}
.f.mem{z-index:6}
.f.center{border:2px solid var(--y);z-index:7}
.f.center .nm{color:var(--y)}
.f.mem{border-color:#8d8d55}
.big .tx{bottom:14px;left:16px}
.big .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--y);width:0}
.big .play{position:absolute;left:16px;top:12px;font-weight:700;font-size:13px;color:var(--dim)}
.slab{position:absolute;left:0;top:0;border:1px solid #4a4a52;background:rgba(30,30,36,.55);border-radius:2px;pointer-events:none;
  transition:transform 1.2s cubic-bezier(.2,.75,.12,1),opacity .8s ease;transform-style:preserve-3d}
.slab span{position:absolute;left:8px;top:6px;font:700 11px/1 "Noto Sans JP",sans-serif;color:var(--dim)}
#faces{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
  padding-inline:max(16px,env(safe-area-inset-left,0px));opacity:0;pointer-events:none;transition:opacity .5s}
#faces.on{opacity:1;pointer-events:auto}
#faces .lb{font:700 12px/34px "Noto Sans JP",sans-serif;color:var(--dim)}
#faces button{font:700 14px/1 "Noto Sans JP",sans-serif;color:var(--fg);background:#18181c;border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
#faces button.on{background:var(--y);color:#000;border-color:var(--y)}
#hd{position:fixed;left:0;right:0;top:calc(var(--ht,12px) + env(safe-area-inset-top,0px));text-align:center;font-weight:900;font-size:var(--hs,22px);pointer-events:none;
  transition:opacity .5s;padding-inline:max(16px,env(safe-area-inset-left,0px))}
#hd small{display:block;font-weight:700;font-size:.55em;color:var(--dim);margin-top:2px}
#back{position:fixed;z-index:50;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));font:700 12px/1 "Noto Sans JP",sans-serif;
  color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
#back.on{opacity:1;pointer-events:auto}
#watch{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.82);display:none;place-items:center}
#watch.on{display:grid}
#watch div{border:1px solid var(--line);background:var(--card);width:min(86vw,720px);aspect-ratio:16/9;display:grid;place-items:center;text-align:center;font-weight:700;color:var(--dim);line-height:1.8}
#watch b{color:var(--fg);font-size:18px}
</style>

    ["098", "1:12", "ポール確定", "決めた側", "決める", "決まる瞬間"],
    ["098", "1:29", "拳を合わせるピット", "指揮官", "笑う", "直後"],
  ].map((r, i) => ({ i, no: r[0], t: r[1], nm: r[2], side: r[3], body: r[4], time: r[5], age: r[6] || null }));
  const mom = Object.fromEntries(MOM.map((m) => [m.no, m]));
  const LIVE = new Set(F.map((f) => f.no));

  const st = document.getElementById("st"), hd = document.getElementById("hd"), faces = document.getElementById("faces"), back = document.getElementById("back");
  let W = 0, H = 0, por = false, S = 1;
  const rnd = (s) => { let x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
  const mk = (cls, nm, sb) => { const e = document.createElement("div"); e.className = "c " + cls; e.innerHTML = `<div class="ph"></div><div class="tx"><div class="nm">${nm}</div>${sb ? `<div class="sb">${sb}</div>` : ""}</div>`; st.appendChild(e); return e; };
  const put = (e, x, y, w, h, s = 1, o = 1, z = 0) => { e.style.width = w + "px"; e.style.height = h + "px"; e.style.transform = `translate3d(${x - w / 2}px,${y - h / 2}px,${z}px) scale(${s})`; e.style.opacity = o; };

  // 宇宙の100本
  const U = MOM.map((m, k) => { const e = mk("u" + (LIVE.has(m.no) ? " live" : ""), m.title, m.sport); e.onclick = () => state === "uni" && LIVE.has(m.no) && open(m.no); return { m, e, k }; });
  // かけら
  const FE = F.map((f) => { const e = mk("f", f.nm, `${mom[f.no].sport}　${f.t}`); e.style.opacity = 0; e.style.pointerEvents = "none"; e.onclick = () => onFrag(f); return e; });

  let state = "uni", openNo = null, center = null, axis = "side", big = null, slabs = [];

  function size() { W = innerWidth; H = innerHeight; por = W / H < 1; S = Math.min(1, W / 1280 + 0.25); document.documentElement.style.setProperty("--hs", (por ? 18 : 22) + "px"); document.documentElement.style.setProperty("--ht", (por && state !== "uni" ? 52 : 12) + "px"); }
  // 100本は重ならないよう揺らした格子に置く（明るい12本は少し大きく、手前）
  const cols = () => (por ? 5 : 10), rows = () => Math.ceil(100 / cols());
  const cell = () => ({ w: W / cols(), h: (H - (por ? 96 : 84) - 16) / rows() });
  const uniPos = (k) => { const c = cell(), col = k % cols(), row = Math.floor(k / cols());
    return { x: (col + 0.5 + (rnd(k + 1) - 0.5) * 0.18) * c.w, y: (por ? 96 : 84) + (row + 0.5 + (rnd(k + 7) - 0.5) * 0.18) * c.h, s: 0.86 + rnd(k + 13) * 0.1 }; };
  const uw = () => cell().w * 0.86, uh = () => Math.min(cell().h * 0.8, cell().w * 0.86 * 9 / 16);
  const fw = () => (por ? 132 : 176), fh = () => (por ? 62 : 74);

  function layoutUni() {
    hd.innerHTML = `100の瞬間<small>明るい12本は中まで読めています。1本選んでください</small>`;
    U.forEach(({ m, e, k }) => { const p = uniPos(k); const live = LIVE.has(m.no); put(e, p.x, p.y, uw(), uh(), p.s * (live ? 1.08 : 0.9), live ? 1 : 0.32); e.style.zIndex = live ? 2 : 1; e.style.setProperty("--fs", (por ? 9 : 11) + "px"); e.style.pointerEvents = "auto"; });
    FE.forEach((e) => { e.style.opacity = 0; e.style.pointerEvents = "none"; });
  }

  // ① 1本を開く: 映像（ワイヤーでは灰色の箱）が再生され、1秒ごとの板になって奥へほどけ、かけらが浮かぶ
  function open(no) {
    state = "open"; openNo = no; back.classList.add("on"); size(); faces.classList.remove("on");
    const m = mom[no]; hd.innerHTML = `${m.title}<small>${m.sport}</small>`;
    U.forEach(({ m: mm, e }) => { if (mm.no !== no) { const p = e.style.transform; e.style.opacity = 0.06; e.style.pointerEvents = "none"; } });
    const u = U.find((x) => x.m.no === no).e; u.style.opacity = 0; u.style.pointerEvents = "none";
    const bw = por ? W - 32 : Math.min(W * 0.5, 640), bh = bw * 9 / 16, cx = W / 2, cy = por ? H * 0.3 : H * 0.42;
    big = mk("big", m.title, "映像を再生中（ワイヤーでは灰色の箱）"); big.insertAdjacentHTML("beforeend", `<div class="play">▶ ${m.sport}</div><div class="bar"></div>`);
    big.style.setProperty("--fs", "18px");
    const p0 = uniPos(U.find((x) => x.m.no === no).k);
    big.style.transition = "none"; put(big, p0.x, p0.y, uw(), uh(), 1, 1); big.offsetWidth; big.style.transition = "";
    put(big, cx, cy, bw, bh);
    const bar = big.querySelector(".bar"); setTimeout(() => { bar.style.transition = "width 2.2s linear"; bar.style.width = "100%"; }, 900);
    const mine = F.filter((f) => f.no === no);
    setTimeout(() => {
      // 1秒ごとの板が奥へ並ぶ
      big.style.opacity = 0;
      slabs = mine.map((f, k) => { const s = document.createElement("div"); s.className = "slab"; s.innerHTML = `<span>${f.t}</span>`; st.appendChild(s);
        s.style.width = bw + "px"; s.style.height = bh + "px"; s.style.transition = "none"; s.style.transform = `translate3d(${cx - bw / 2}px,${cy - bh / 2}px,0)`; s.offsetWidth; s.style.transition = "";
        const dx = por ? 0 : (k - (mine.length - 1) / 2) * 26, dy = por ? -k * 6 : 0;
        s.style.transitionDelay = k * 0.07 + "s"; s.style.transform = `translate3d(${cx - bw / 2 + dx}px,${cy - bh / 2 + dy}px,${-k * 150 - 60}px) rotateY(${por ? 0 : -18}deg)`; return s; });
    }, 3300);
    setTimeout(() => {
      // 板の中からかけらが抜き出されて手前に浮かぶ
      slabs.forEach((s) => (s.style.opacity = 0.16));
      const n = mine.length, cols = por ? 2 : Math.min(n, 3), rows = Math.ceil(n / cols);
      const gw = por ? (W - 48) / 2 : fw() * 1.15, gh = fh() + (por ? 14 : 22);
      const y0 = por ? H * 0.5 : H * 0.5;
      mine.forEach((f, k) => { const e = FE[f.i]; const col = k % cols, row = Math.floor(k / cols);
        const x = W / 2 + (col - (cols - 1) / 2) * (gw + (por ? 8 : 20)), y = y0 + (row - (rows - 1) / 2) * gh + (por ? 40 : 30);
        e.style.transition = "none"; put(e, W / 2, cy, fw(), fh(), 0.3, 0, -600); e.offsetWidth; e.style.transition = ""; e.style.transitionDelay = k * 0.12 + "s";
        e.style.setProperty("--fs", (por ? 13 : 15) + "px"); put(e, x, y, por ? gw : fw(), fh(), 1, 1); e.style.pointerEvents = "auto"; });
      hd.innerHTML = `${m.title}<small>この映像の中の「誰のどの1秒」を見ますか</small>`;
      setTimeout(() => FE.forEach((e) => (e.style.transitionDelay = "")), 2000);
    }, 4700);
  }

  // ② かけらを選ぶ → 残りの本もかけらにほどけ、近いかけらが集まって塊になる
  function onFrag(f) {
    if (state === "open") { burst(f); return; }
    if (state === "cl") { if (center === f) { watch(f); return; } focus(f, axis); }
  }
  function burst(f) {
    state = "cl"; axis = "side";
    slabs.forEach((s) => s.remove()); slabs = []; if (big) { big.remove(); big = null; }
    // 他の本の箱が、その場でかけらに割れる
    U.forEach(({ m, e, k }) => { e.style.opacity = 0; e.style.pointerEvents = "none"; });
    F.forEach((g) => { if (g.no === f.no) return; const e = FE[g.i]; const k = U.find((x) => x.m.no === g.no).k, p = uniPos(k);
      e.style.transition = "none"; put(e, p.x, p.y, fw(), fh(), 0.35, 0); e.offsetWidth; e.style.transition = ""; });
    requestAnimationFrame(() => focus(f, axis, true));
  }
  const val = (g, a) => g[a];
  function focus(f, a, first) {
    center = f; axis = a;
    const v = val(f, a);
    const mem = v ? F.filter((g) => g !== f && val(g, a) === v) : [];
    // 近さ = 他の観点でも一致する数。別の映像を先に
    mem.sort((p, q) => (q.no !== f.no) - (p.no !== f.no) || AX.reduce((s, [k]) => s + (q[k] && q[k] === f[k]) - (p[k] && p[k] === f[k]), 0));
    const MAX = por ? 10 : 14, shown = mem.slice(0, MAX); const rest = F.filter((g) => g !== f && !mem.includes(g));
    const cx = W / 2, cy = por ? H * 0.43 : H * 0.47;
    const cwz = por ? 170 : 230, chz = por ? 82 : 100;
    FE.forEach((e) => e.classList.remove("center", "mem"));
    const ce = FE[f.i]; ce.classList.add("center"); ce.style.setProperty("--fs", (por ? 15 : 18) + "px"); put(ce, cx, cy, cwz, chz, 1, 1, 40); ce.style.pointerEvents = "auto";
    // 塊: 中心のまわりの格子（半段ずらし）に、近い順に並ぶ。重ならない・画面からはみ出さない
    const mw = por ? 112 : 168, mh = por ? 52 : 70, gx = por ? 8 : 18, gy = por ? 10 : 16;
    const top = por ? 104 : 86, bot = H - (por ? 120 : 70);
    const cells = [];
    for (let r = -8; r <= 8; r++) for (let c = -8; c <= 8; c++) {
      const x = cx + c * (mw + gx) + (Math.abs(r) % 2 ? (mw + gx) / 2 : 0), y = cy + r * (mh + gy);
      if (Math.abs(x - cx) < (cwz + mw) / 2 + gx / 2 && Math.abs(y - cy) < (chz + mh) / 2 + gy / 2) continue;
      if (x - mw / 2 < 8 || x + mw / 2 > W - 8 || y - mh / 2 < top || y + mh / 2 > bot) continue;
      cells.push({ x, y, d: Math.hypot((x - cx) / (mw + gx), (y - cy) / (mh + gy) * 1.15) });
    }
    cells.sort((p, q) => p.d - q.d);
    shown.length = Math.min(shown.length, cells.length);
    // 近い順の上位ほど中心寄りのマスへ
    shown.forEach((g, k) => { const e = FE[g.i]; e.classList.add("mem"); const c = cells[k];
      e.style.transitionDelay = (first ? 0.35 : 0.05) + k * 0.06 + "s"; e.style.setProperty("--fs", (por ? 11 : 13) + "px");
      put(e, c.x, c.y, mw, mh, 1, 1, 0); e.style.pointerEvents = "auto"; });
    rest.push(...mem.filter((g) => !shown.includes(g)));
    // それ以外は遠のく
    rest.forEach((g) => { const e = FE[g.i]; const a0 = rnd(g.i + 3) * Math.PI * 2, rr = 0.62 + rnd(g.i + 5) * 0.35;
      e.style.transitionDelay = "0s"; e.style.setProperty("--fs", "12px");
      put(e, cx + Math.cos(a0) * W * rr * 0.62, cy + Math.sin(a0) * H * rr * 0.62, fw(), fh(), 0.42, 0.13, -420); e.style.pointerEvents = "none"; });
    setTimeout(() => FE.forEach((e) => (e.style.transitionDelay = "")), 1800);
    hd.innerHTML = v ? `${f.nm}<small>「${v}」でつながる${mem.length}のかけら（${new Set(mem.map((g) => g.no)).size}本の映像から）　もう一度押すと映像を観る</small>` : `${f.nm}<small>この観点の読みはありません</small>`;
    // 顔（観点）の切り替え: このかけら自身の読みが並ぶ
    faces.innerHTML = `<span class="lb">このかけらの顔</span>` + AX.filter(([k]) => f[k]).map(([k, lb]) => `<button data-a="${k}" class="${k === a ? "on" : ""}">${f[k]}</button>`).join("");
    faces.querySelectorAll("button").forEach((b) => (b.onclick = () => focus(center, b.dataset.a)));
    faces.classList.add("on");
  }
  function watch(f) { const w = document.getElementById("watch"); w.firstElementChild.innerHTML = `<span>▶ 映像（ワイヤーでは再生しません）<br><b>${mom[f.no].title}</b><br>${f.t} から再生</span>`; w.classList.add("on"); }
  document.getElementById("watch").onclick = (e) => e.currentTarget.classList.remove("on");

  back.onclick = () => { slabs.forEach((s) => s.remove()); slabs = []; if (big) { big.remove(); big = null; } FE.forEach((e) => e.classList.remove("center", "mem"));
    state = "uni"; center = null; back.classList.remove("on"); faces.classList.remove("on"); size(); layoutUni(); };
  addEventListener("resize", () => { size(); if (state === "uni") layoutUni(); else if (state === "cl") focus(center, axis); });
  size(); layoutUni();
  window.__w = { open, onFrag, F, get state() { return state; }, focus: (i, a) => focus(F[i], a) };
})();
</script>
