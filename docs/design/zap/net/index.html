    const v = ax.clone().multiplyScalar(Math.cos(pol)).addScaledVector(t1, Math.sin(pol) * Math.cos(az)).addScaledVector(t2, Math.sin(pol) * Math.sin(az)).normalize();
    DIR.set([v.x, v.y, v.z], c * 3); });
}
const R = [0, 22, 8, 3.4];                         // 子の広がりの半径（層ごと）
const OPEN = [[80, 190], [40, 95], [14, 34]];       // 子が開ききる距離・開き始める距離（カメラから）

// ---- 描画 ----
const canvas = document.getElementById("c");

addEventListener("resize", resize); resize();
const TW = 64, TH = Math.ceil(N / TW), posData = new Float32Array(TW * TH * 4);
const posTex = new THREE.DataTexture(posData, TW, TH, THREE.RGBAFormat, THREE.FloatType); posTex.needsUpdate = true;

// 糸: 要素→人→出来事→瞬間→瞬間→出来事→人→要素 の8点を通る B スプライン（束ねる強さ uBeta）。位置はテクスチャから毎フレーム読む
const SEG = portrait() ? 28 : 40, NF = D.fibers.length;
const g = new THREE.BufferGeometry(), nv = NF * SEG * 2;
// 束の形（瞬間どうしの直線からのずれ、6点）
const NB = D.bundles.length, bData = new Float32Array(6 * Math.max(1, NB) * 4);
D.bundles.forEach((b, i) => b.forEach((o, k) => bData.set([o[0], o[1], o[2], 0], (i * 6 + k) * 4)));
const bTex = new THREE.DataTexture(bData, 6, Math.max(1, NB), THREE.RGBAFormat, THREE.FloatType); bTex.needsUpdate = true;
const aC0 = new Float32Array(nv * 4), aC1 = new Float32Array(nv * 4), aT = new Float32Array(nv), aHL = new Float32Array(nv), aR = new Float32Array(nv), aPD = new Float32Array(nv * 2);

g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
g.setAttribute("aC0", new THREE.BufferAttribute(aC0, 4)); g.setAttribute("aC1", new THREE.BufferAttribute(aC1, 4));
g.setAttribute("aT", new THREE.BufferAttribute(aT, 1)); g.setAttribute("aR", new THREE.BufferAttribute(aR, 1)); g.setAttribute("aPD", new THREE.BufferAttribute(aPD, 2)); const hlAttr = new THREE.BufferAttribute(aHL, 1); g.setAttribute("aHL", hlAttr);
const fiberMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3, transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending,

    uniform float uSel, uA, uProg; in float vHL, vT, vD, vR; out vec4 o;
    void main(){

// 選んだ糸だけは太い帯で描く（GPU の線は1px なので、CPU で同じ B スプラインを計算して画面に向いた帯にする）
const HSEG = 90, HMAX = 24, hPos = new Float32Array(HMAX * (HSEG + 1) * 2 * 3), hT = new Float32Array(HMAX * (HSEG + 1) * 2), hIdx = [];

  uniforms: { uProg: { value: 0 } },
  vertexShader: `in float aT; out float vT; void main(){ vT=aT; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader: `uniform float uProg; in float vT; out vec4 o; void main(){ float done=smoothstep(uProg, uProg-0.05, vT), head=exp(-pow((vT-uProg)*14.0,2.0));
    o=vec4(mix(vec3(1.0,0.74,0.42), vec3(1.0,0.97,0.9), head), 0.55*done+0.9*head); }` });

let HF = [];   // [fiber, 向き]

  for (let k = 0; k < 4; k++) { P(c[k], C14[k]); P(c[4 + k], C14[10 + k]); }

  const k = 2 * Math.tan(cam.fov * Math.PI / 360) / innerHeight * (portrait() ? 3.2 : 2.6);   // 画面上でおよそ 2.6px の太さ
  for (let h = 0; h < n; h++) { const [f, dir] = HF[h];
    for (let s = 0; s <= HSEG; s++) fiberAt(f, s / HSEG, PTS[s]);
    for (let s = 0; s <= HSEG; s++) { const p = PTS[s]; TQ.subVectors(PTS[Math.min(HSEG, s + 1)], PTS[Math.max(0, s - 1)]); TV.subVectors(cam.position, p);

// 枝（瞬間→出来事→人→要素の所属）: 1本の瞬間がどれだけ細かく読まれているかが形で見える
const dg = new THREE.BufferGeometry(), dI = [];
for (let i = 0; i < N; i++) if (PAR[i] >= 0) dI.push(PAR[i], i);
dg.setAttribute("position", new THREE.BufferAttribute(new Float32Array(dI.length * 3), 3)); dg.setAttribute("aI", new THREE.BufferAttribute(new Float32Array(dI), 1));
dg.setAttribute("aLv", new THREE.BufferAttribute(new Float32Array(dI.map((n) => LV[n])), 1));
const dendMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, transparent: true, depthWrite: false, depthTest: false,
  uniforms: { uPos: { value: posTex }, uW: { value: TW }, uSel: { value: 0 } },
  vertexShader: `uniform sampler2D uPos; uniform float uW; in float aI, aLv; out float vD, vLv;
    void main(){ vec3 p=texelFetch(uPos, ivec2(int(mod(aI,uW)), int(floor(aI/uW))), 0).xyz; vLv=aLv; vec4 mv=modelViewMatrix*vec4(p,1.0); vD=-mv.z; gl_Position=projectionMatrix*mv; }`,
  fragmentShader: `uniform float uSel; in float vD, vLv; out vec4 o;
    void main(){ float near=smoothstep(0.3,2.0,vD)*mix(1.0,0.3,smoothstep(250.0,520.0,vD)); o=vec4(vec3(0.86,0.9,0.96), (0.6-0.1*vLv)*near*(1.0-0.45*uSel)); }` });

const firstUnit = (i) => { if (LV[i] === 2) return UNIT[i]; for (const c of KIDS[i]) { const u = firstUnit(c); if (u >= 0) return u; } return -1; };

  vertexShader: `in float aL, aV; out vec2 vUv; out float vL, vV; void main(){ vUv=uv; vL=aL; vV=aV; gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.0); }`,

(async () => { const cv = document.createElement("canvas"); cv.width = 16 * LW; cv.height = 16 * LH; const x = cv.getContext("2d", { willReadFrequently: true });
  for (const s of sheets) { const im = new Image(); im.src = `sheet${s}.jpg`; try { await im.decode(); } catch { continue; }
    x.drawImage(im, 0, 0); const px = x.getImageData(0, 0, cv.width, cv.height).data;
    for (let k = 0; k < 256 && s * 256 + k < NL; k++) { const L = s * 256 + k, cx = (k % 16) * LW, cy = Math.floor(k / 16) * LH;

  arr.needsUpdate = true; })();

const labelsEl = document.getElementById("labels"), POOL = [];
const CAP = () => (portrait() ? 40 : 80);
for (let k = 0; k < 110; k++) { const d = document.createElement("div"); d.className = "lb"; d.style.opacity = 0; d.addEventListener("click", (e) => { e.stopPropagation(); if (d._i >= 0) select(d._i); }); labelsEl.appendChild(d); POOL.push(d); }

// ---- カメラ（ダイヤル＝ズーム、ドラッグ＝回す） ----
const D0 = portrait() ? 620 : 300, CAMS = { pivot: new THREE.Vector3(), dist: D0, th: 0.6, ph: 0.18 }, GOAL = { pivot: new THREE.Vector3(), dist: D0 };

const ptrs = new Map(); let pinch0 = 0, moved = 0;
