<title>熱狂の神経系</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{color-scheme:dark;--bg:#030406;--fg:#eef0f2;--dim:rgba(238,240,242,.5);--warm:#f3d9a4}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;
  font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:auto;cursor:pointer;will-change:transform,opacity;
  text-shadow:0 0 6px #000,0 0 2px #000;letter-spacing:.02em;line-height:1.2;transition:color .4s}
.lb.l0{font-size:14px;font-weight:600}
.lb.l1{font-size:12.5px;color:#cfd6de}
.lb.l2{font-size:11.5px;color:#b9c2cc}
.lb.l3{font-size:11.5px;color:#e6e0d4}
.lb.lit{color:var(--warm)}
.lb.sel{color:#fff;font-weight:700}
#cap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);margin:auto;width:min(720px,calc(100% - 32px));
  font-size:13px;line-height:1.7;color:var(--fg);text-align:center;opacity:0;transition:opacity .6s;pointer-events:none;text-shadow:0 0 8px #000}
#cap.on{opacity:1}
#cap .w{color:var(--warm)}
@media (max-width:600px){.lb.l0{font-size:12.5px}.lb.l1,.lb.l2,.lb.l3{font-size:11px}#cap{font-size:12px}}
</style>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="cap"></div>
<script src="data.js" charset="utf-8"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";
const D = window.NET, Q = new URLSearchParams(location.search);
const N = D.nodes.length, LV = new Int8Array(N), PAR = new Int32Array(N), UNIT = new Int32Array(N);
D.nodes.forEach((n, i) => { LV[i] = n[0]; PAR[i] = n[1]; UNIT[i] = n[3]; });
const KIDS = Array.from({ length: N }, () => []); for (let i = 0; i < N; i++) if (PAR[i] >= 0) KIDS[PAR[i]].push(i);
const MOM = new Int32Array(N); for (let i = 0; i < N; i++) MOM[i] = PAR[i] < 0 ? i : MOM[PAR[i]];
const portrait = () => innerHeight > innerWidth;

// ---- 入れ子の配置: 子は親のまわりの決まった方向に、親が「開いた」分だけ広がる ----
let seed = 5; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const DIR = new Float32Array(N * 3), BASE = new Float32Array(N * 3);
for (let p = 0; p < N; p++) {
  const k = KIDS[p], n = k.length, rot = new THREE.Quaternion().setFromEuler(new THREE.Euler(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28));
  k.forEach((c, j) => { const y = n === 1 ? 0 : 1 - (2 * (j + 0.5)) / n, r = Math.sqrt(1 - y * y), th = j * 2.399963 + rnd() * 0.3;
    const v = new THREE.Vector3(Math.cos(th) * r, y * 0.8, Math.sin(th) * r).normalize().applyQuaternion(rot); DIR.set([v.x, v.y, v.z], c * 3); });
}
for (const [k, p] of Object.entries(D.pos)) BASE.set(p, +k * 3);
const R = [0, 9, 2.6, 0.95];                         // 子の広がりの半径（層ごと）
const OPEN = [[34, 80], [7, 18], [2.6, 6.5]];        // その層の要素の子が開き始める距離・開ききる距離（カメラから）
const POS = new Float32Array(N * 3), OPN = new Float32Array(N), VIS = new Float32Array(N), BOOST = new Float32Array(N);
const PULL = new Float32Array(N * 3), PULLT = new Float32Array(N * 3);   // 塊になるときの瞬間の移動

// ---- 描画 ----
const canvas = document.getElementById("c");
const R3 = new THREE.WebGLRenderer({ canvas, antialias: true }); R3.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(55, 1, 0.05, 2000);
function resize() { R3.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.fov = portrait() ? 68 : 55; cam.updateProjectionMatrix(); }
addEventListener("resize", resize); resize();
const TW = 64, TH = Math.ceil(N / TW), posData = new Float32Array(TW * TH * 4);
const posTex = new THREE.DataTexture(posData, TW, TH, THREE.RGBAFormat, THREE.FloatType); posTex.needsUpdate = true;

// 糸: 要素→人→出来事→瞬間→瞬間→出来事→人→要素 の8点を通る B スプライン（束ねる強さ uBeta）。位置はテクスチャから毎フレーム読む
const SEG = portrait() ? 20 : 30, NF = D.fibers.length;
const g = new THREE.BufferGeometry(), nv = NF * SEG * 2;
const aC0 = new Float32Array(nv * 4), aC1 = new Float32Array(nv * 4), aT = new Float32Array(nv), aHL = new Float32Array(nv);
for (let f = 0, v = 0; f < NF; f++) { const c = D.fibers[f];
  for (let s = 0; s < SEG; s++) for (const tt of [s / SEG, (s + 1) / SEG]) { aC0.set(c.slice(0, 4), v * 4); aC1.set(c.slice(4, 8), v * 4); aT[v] = tt; v++; } }
g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(nv * 3), 3));
g.setAttribute("aC0", new THREE.BufferAttribute(aC0, 4)); g.setAttribute("aC1", new THREE.BufferAttribute(aC1, 4));
g.setAttribute("aT", new THREE.BufferAttribute(aT, 1)); const hlAttr = new THREE.BufferAttribute(aHL, 1); g.setAttribute("aHL", hlAttr);
const fiberMat = new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3, transparent: true, depthWrite: false, depthTest: false,
  uniforms: { uPos: { value: posTex }, uW: { value: TW }, uBeta: { value: 0.82 }, uSel: { value: 0 }, uA: { value: 0.07 } },
  vertexShader: `
    uniform sampler2D uPos; uniform float uW, uBeta; in vec4 aC0, aC1; in float aT, aHL; out float vHL, vT, vD;
    vec3 P(float i){ return texelFetch(uPos, ivec2(int(mod(i,uW)), int(floor(i/uW))), 0).xyz; }
    void main(){
      vec3 C[8]; C[0]=P(aC0.x);C[1]=P(aC0.y);C[2]=P(aC0.z);C[3]=P(aC0.w);C[4]=P(aC1.x);C[5]=P(aC1.y);C[6]=P(aC1.z);C[7]=P(aC1.w);
      vec3 a=C[0], b=C[7]; for(int k=1;k<7;k++) C[k]=mix(a+(b-a)*float(k)/7.0, C[k], uBeta);
      float u=aT*9.0; int s=int(min(floor(u),8.0)); float f=u-float(s);
      vec3 q[4]; for(int j=0;j<4;j++){ int i=s+j; q[j]= i<=2 ? C[0] : (i>=9 ? C[7] : C[i-2]); }
      float f2=f*f, f3=f2*f;
      vec3 p=q[0]*((1.0-f)*(1.0-f)*(1.0-f)/6.0)+q[1]*((3.0*f3-6.0*f2+4.0)/6.0)+q[2]*((-3.0*f3+3.0*f2+3.0*f+1.0)/6.0)+q[3]*(f3/6.0);
      vHL=aHL; vT=aT; vec4 mv=modelViewMatrix*vec4(p,1.0); vD=-mv.z; gl_Position=projectionMatrix*mv;
    }`,
  fragmentShader: `
    uniform float uSel, uA; in float vHL, vT, vD; out vec4 o;
    void main(){
      vec3 cool=vec3(0.52,0.60,0.70), warm=vec3(0.98,0.84,0.58);
      float near=smoothstep(0.4,3.0,vD);                    // カメラの直前は消す
      float a = vHL>0.5 ? 0.75 : uA*(1.0-0.72*uSel);
      o=vec4(mix(cool,warm,vHL), a*near);
    }`,
});
const fibers = new THREE.LineSegments(g, fiberMat); fibers.frustumCulled = false; scene.add(fibers);

// 人（L2）は、その人が映る1秒のコマ
const NP = D.nodes.filter((n) => n[0] === 2).length, P2 = []; for (let i = 0; i < N; i++) if (LV[i] === 2) P2.push(i);
const LW = 192, LH = 108, sheets = [0, 1, 2], NL = 683, layers = new Uint8Array(LW * LH * 4 * NL);
const arr = new THREE.DataArrayTexture(layers, LW, LH, NL); arr.generateMipmaps = true; arr.minFilter = THREE.LinearMipmapLinearFilter; arr.magFilter = THREE.LinearFilter;
const pg = new THREE.PlaneGeometry(1.6, 0.9); const aL = new THREE.InstancedBufferAttribute(new Float32Array(NP), 1), aV = new THREE.InstancedBufferAttribute(new Float32Array(NP), 1);
P2.forEach((i, k) => (aL.array[k] = Math.max(0, UNIT[i]))); pg.setAttribute("aL", aL); pg.setAttribute("aV", aV);
const imgMat = new THREE.ShaderMaterial({ glslVersion: THREE.GLSL3, transparent: true, depthWrite: false, uniforms: { uTex: { value: arr } },
  vertexShader: `in float aL, aV; out vec2 vUv; out float vL, vV; void main(){ vUv=uv; vL=aL; vV=aV; gl_Position=projectionMatrix*modelViewMatrix*instanceMatrix*vec4(position,1.0); }`,
  fragmentShader: `precision highp sampler2DArray; uniform sampler2DArray uTex; in vec2 vUv; in float vL, vV; out vec4 o;
    void main(){ vec3 c=texture(uTex, vec3(vUv.x,1.0-vUv.y,vL)).rgb; o=vec4(c*(0.55+0.45*vV), vV); }` });
const imgs = new THREE.InstancedMesh(pg, imgMat, NP); imgs.frustumCulled = false; imgs.renderOrder = 2; scene.add(imgs);
(async () => { const cv = document.createElement("canvas"); cv.width = 16 * LW; cv.height = 16 * LH; const x = cv.getContext("2d", { willReadFrequently: true });
  for (const s of sheets) { const im = new Image(); im.src = `sheet${s}.jpg`; try { await im.decode(); } catch { continue; }
    x.drawImage(im, 0, 0); const px = x.getImageData(0, 0, cv.width, cv.height).data;
    for (let k = 0; k < 256 && s * 256 + k < NL; k++) { const L = s * 256 + k, cx = (k % 16) * LW, cy = Math.floor(k / 16) * LH;
      for (let y = 0; y < LH; y++) layers.set(px.subarray(((cy + y) * cv.width + cx) * 4, ((cy + y) * cv.width + cx + LW) * 4), (L * LH + y) * LW * 4); } }
  arr.needsUpdate = true; })();

// ---- 文字（DOM）: 今いる深さで見えているものだけ、重ならないように ----
const labelsEl = document.getElementById("labels"), POOL = [];
const CAP = () => (portrait() ? 46 : 90);
for (let k = 0; k < 110; k++) { const d = document.createElement("div"); d.className = "lb"; d.style.opacity = 0; d.addEventListener("click", (e) => { e.stopPropagation(); if (d._i >= 0) select(d._i); }); labelsEl.appendChild(d); POOL.push(d); }

// ---- カメラ（ダイヤル＝ズーム、ドラッグ＝回す） ----
const CAMS = { pivot: new THREE.Vector3(), dist: 330, th: 0.6, ph: 0.25 }, GOAL = { pivot: new THREE.Vector3(), dist: 330 };
let auto = true, touched = false;
function camUpdate(dt) {
  CAMS.pivot.lerp(GOAL.pivot, 1 - Math.exp(-dt * 2.2)); CAMS.dist += (GOAL.dist - CAMS.dist) * (1 - Math.exp(-dt * 2.4));
  if (auto) CAMS.th += dt * 0.035;
  const d = CAMS.dist; cam.position.set(CAMS.pivot.x + d * Math.cos(CAMS.ph) * Math.sin(CAMS.th), CAMS.pivot.y + d * Math.sin(CAMS.ph), CAMS.pivot.z + d * Math.cos(CAMS.ph) * Math.cos(CAMS.th));
  cam.lookAt(CAMS.pivot); cam.updateMatrixWorld();
}
const ptrs = new Map(); let pinch0 = 0, moved = 0;
canvas.addEventListener("pointerdown", (e) => { canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; auto = false; touched = true;
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); } });
canvas.addEventListener("pointermove", (e) => { if (!ptrs.has(e.pointerId)) return; const p = ptrs.get(e.pointerId), dx = e.clientX - p[0], dy = e.clientY - p[1];
  ptrs.set(e.pointerId, [e.clientX, e.clientY]); moved += Math.abs(dx) + Math.abs(dy);
  if (ptrs.size === 1) { CAMS.th -= dx * 0.005; CAMS.ph = Math.max(-1.3, Math.min(1.3, CAMS.ph + dy * 0.004)); }
  else if (ptrs.size === 2) { const [a, b] = [...ptrs.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch0) zoomBy(pinch0 / d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch0 = d; } });
const endPtr = (e) => { const wasTap = ptrs.size === 1 && moved < 8; ptrs.delete(e.pointerId); if (wasTap) select(-1); };
canvas.addEventListener("pointerup", endPtr); canvas.addEventListener("pointercancel", (e) => ptrs.delete(e.pointerId));
canvas.addEventListener("wheel", (e) => { e.preventDefault(); auto = false; touched = true; zoomBy(Math.exp(e.deltaY * 0.0014), e.clientX, e.clientY); }, { passive: false });
// 寄るときは、カーソルの近くで見えているものへ中心を寄せる（ダイヤルを回すとそこへ潜っていく）
function zoomBy(f, x, y) {
  GOAL.dist = Math.max(1.6, Math.min(420, GOAL.dist * f));
  if (f < 1) { const t = nearestScreen(x, y, 160); if (t >= 0) GOAL.pivot.lerp(new THREE.Vector3(POS[t * 3], POS[t * 3 + 1], POS[t * 3 + 2]), Math.min(0.5, (1 - f) * 2.2)); }
}
const V3 = new THREE.Vector3();
function scr(i) { V3.set(POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2]).project(cam); return [(V3.x + 1) / 2 * innerWidth, (1 - V3.y) / 2 * innerHeight, V3.z]; }
function nearestScreen(x, y, r) { let best = -1, bd = r * r;
  for (let i = 0; i < N; i++) { if (VIS[i] < 0.3) continue; const s = scr(i); if (s[2] > 1) continue; const d = (s[0] - x) ** 2 + (s[1] - y) ** 2;
    const w = d * (1 + LV[i] * 0); if (w < bd && (OPN[i] < 0.6 || LV[i] === 3)) { bd = w; best = i; } }
  return best; }

// ---- 選ぶ: その中から出る糸が温かくなり、届いた先の瞬間が開いて寄ってくる（塊になる） ----
let sel = -1; const LIT = new Uint8Array(N); const cap = document.getElementById("cap");
const inSub = (n, root) => { while (n >= 0) { if (n === root) return true; n = PAR[n]; } return false; };
function select(i) {
  sel = i; LIT.fill(0); BOOST.fill(0); PULLT.fill(0); aHL.fill(0);
  const whys = [];
  if (i >= 0) {
    for (let f = 0; f < NF; f++) { const c = D.fibers[f]; const hit = c.slice(0, 4).includes(i) ? 0 : c.slice(4).includes(i) ? 1 : -1; if (hit < 0) continue;
      for (let v = f * SEG * 2; v < (f + 1) * SEG * 2; v++) aHL[v] = 1;
      const other = hit === 0 ? c.slice(4) : c.slice(0, 4);            // 相手側（要素…瞬間）
      for (const n of other) { LIT[n] = 1; BOOST[n] = 1; }
      for (const n of (hit === 0 ? c.slice(0, 4) : c.slice(4))) { LIT[n] = 1; if (LV[n] <= LV[i]) {} }
      whys.push([D.whys[f], hit === 0 ? c[7] : c[0]]);
    }
    // 届いた先の瞬間を、選んだものの瞬間のほうへ寄せる（層の中の塊）
    const m0 = MOM[i], tgt = [BASE[m0 * 3], BASE[m0 * 3 + 1], BASE[m0 * 3 + 2]];
    const ms = new Set(); for (let n = 0; n < N; n++) if (LIT[n] && LV[n] === 0 && n !== m0) ms.add(n);
    for (const m of ms) for (let k = 0; k < 3; k++) PULLT[m * 3 + k] = (tgt[k] - BASE[m * 3 + k]) * 0.55;
    LIT[i] = 2; for (let n = PAR[i]; n >= 0; n = PAR[n]) BOOST[n] = 1;
    GOAL.pivot.set(POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2]); GOAL.dist = [70, 20, 8, 5.5][LV[i]] * (portrait() ? 1.35 : 1);
  }
  hlAttr.needsUpdate = true; fiberMat.uniforms.uSel.value = i >= 0 ? 1 : 0;
  // 選んだのが要素なら、届いた先の具体と一文を出す（理由が辿れる＝ブラックボックスにしない）
  if (i >= 0 && LV[i] === 3 && whys.length) {
    cap.innerHTML = whys.slice(0, portrait() ? 2 : 3).map(([w, o]) => `<div><span class="w">${esc(D.nodes[o][2])}</span>　${esc(D.nodes[MOM[o]][2])}<br>${esc(w)}</div>`).join("");
    cap.classList.add("on");
  } else cap.classList.remove("on");
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ---- 毎フレーム ----
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const M4 = new THREE.Matrix4(), QI = new THREE.Quaternion(), S3 = new THREE.Vector3(), PV = new THREE.Vector3();
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  camUpdate(dt);
  for (let k = 0; k < N * 3; k++) PULL[k] += (PULLT[k] - PULL[k]) * (1 - Math.exp(-dt * 1.8));
  const cx = cam.position.x, cy = cam.position.y, cz = cam.position.z;
  for (let i = 0; i < N; i++) {
    const p = PAR[i];
    if (p < 0) { POS[i * 3] = BASE[i * 3] + PULL[i * 3]; POS[i * 3 + 1] = BASE[i * 3 + 1] + PULL[i * 3 + 1]; POS[i * 3 + 2] = BASE[i * 3 + 2] + PULL[i * 3 + 2]; VIS[i] = 1; }
    else { const e = OPN[p], r = R[LV[i]] * e;
      POS[i * 3] = POS[p * 3] + DIR[i * 3] * r; POS[i * 3 + 1] = POS[p * 3 + 1] + DIR[i * 3 + 1] * r; POS[i * 3 + 2] = POS[p * 3 + 2] + DIR[i * 3 + 2] * r; VIS[i] = VIS[p] * e; }
    if (LV[i] < 3) { const d = Math.hypot(POS[i * 3] - cx, POS[i * 3 + 1] - cy, POS[i * 3 + 2] - cz), o = OPEN[LV[i]];
      const tgt = Math.max(ss(o[1], o[0], d), BOOST[i] ? 0.85 : 0); OPN[i] += (tgt - OPN[i]) * (1 - Math.exp(-dt * 3)); } else OPN[i] = 0;
  }
  for (let i = 0; i < N; i++) posData.set([POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2], 1], i * 4); posTex.needsUpdate = true;
  // 人のコマ
  P2.forEach((i, k) => { const v = VIS[i]; aV.array[k] = LIT[i] ? Math.max(v, 0.8) : v; PV.set(POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2]);
    S3.setScalar(v > 0.02 ? 0.25 + 0.75 * v : 0); M4.compose(PV, cam.quaternion, S3); imgs.setMatrixAt(k, M4); });
  imgs.instanceMatrix.needsUpdate = true; aV.needsUpdate = true;
  R3.render(scene, cam);
  drawLabels();
  requestAnimationFrame(frame);
}
// 文字の候補: 開いていない（＝今その深さで見えている）もの、と光っているもの
const occ = new Map();
function drawLabels() {
  const cand = [];
  for (let i = 0; i < N; i++) {
    let a = VIS[i] * (LV[i] === 3 ? 1 : 1 - 0.85 * OPN[i]); if (LIT[i]) a = Math.max(a, VIS[i] > 0.2 ? 0.95 : 0); if (i === sel) a = 1;
    if (a < 0.12) continue; const s = scr(i); if (s[2] > 1 || s[0] < -40 || s[0] > innerWidth + 40 || s[1] < -20 || s[1] > innerHeight + 20) continue;
    const dz = V3.set(POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2]).distanceTo(cam.position);
    cand.push([i, s[0], s[1], a, (i === sel ? -1e6 : 0) + (LIT[i] ? -1e5 : 0) + LV[i] * -50 + dz]);
  }
  cand.sort((x, y) => x[4] - y[4]); occ.clear(); let k = 0; const cap = CAP();
  for (const [i, x, y, a] of cand) { if (k >= cap) break;
    const gx = Math.floor(x / 150), gy = Math.floor(y / 20), key = gx + "," + gy; if (occ.has(key) && !LIT[i] && i !== sel) continue; occ.set(key, 1);
    const d = POOL[k++]; if (d._i !== i) { d._i = i; d.textContent = D.nodes[i][2]; }
    d.className = `lb l${LV[i]}${i === sel ? " sel" : LIT[i] ? " lit" : ""}`;
    d.style.transform = `translate(${x.toFixed(1)}px,${(y + (LV[i] === 2 ? 22 : 0)).toFixed(1)}px) translate(-50%,-50%)`; d.style.opacity = a.toFixed(2);
  }
  for (; k < POOL.length; k++) { POOL[k].style.opacity = 0; POOL[k]._i = -1; POOL[k].style.transform = "translate(-999px,-999px)"; }
}
window.__n = { select, zoomBy, get cams() { return CAMS; }, goal: GOAL, N, NF, find: (s) => D.nodes.findIndex((n) => n[2].includes(s)), pos: (i) => [POS[i * 3], POS[i * 3 + 1], POS[i * 3 + 2]], setAuto: (v) => (auto = v) };
requestAnimationFrame(frame);
</script>
