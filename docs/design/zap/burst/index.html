    // 光線は画面の長い方向へ（PC は左右、スマホは上下）。かけらは向きと大きさから重ならない間隔で並べる
    const ANG = por ? { 2: [90, 270], 3: [100, 80, 270], 4: [100, 80, 260, 280] } : { 2: [180, 0], 3: [160, 20, 270], 4: [152, 28, 208, 332] };
    const cs = por ? 1.45 : 1.6, cw = (P * cs) / 2, ch = (PH * cs) / 2 + (por ? 5.2 : 4.2); // 中心のかけら（名前の分を含む）
    const ps = por ? 0.66 : 0.78, pw = P * ps, ph = PH * ps + (por ? 9.2 : 8.0); // 名前は下にだけ付くが、上下どちらの向きでも重ならないよう両側に取る           // 光線の上のかけら（名前の分を含む）
    const clear = (hw, hh, dx, dy) => Math.min(hw / Math.max(1e-3, Math.abs(dx)), hh / Math.max(1e-3, Math.abs(dy)));
    const used = new Set([f.i]);
    const place = new Map();
    axes.forEach((key, k) => {
      const ang = (ANG[n][k] * Math.PI) / 180, dx = Math.cos(ang), dy = Math.sin(ang);
      const lim = clear(vw / 2 - pw / 2 - 1, vh / 2 - ph / 2 - (por ? 5 : 3), dx, dy);
      const lab = `${f[key]}`, lw = (40 + lab.length * 48) / 72 * 3.0;
      const dLab = clear(cw, ch, dx, dy) + clear(lw / 2, 1.5, dx, dy) + 1.2;
      const step = clear(pw / 2 + 1.2, ph / 2 + 0.8, dx, dy) * 2;
      const d0 = dLab + clear(lw / 2, 1.5, dx, dy) + step / 2 + 0.6;
      const fit = Math.max(1, Math.min(por ? 4 : 4, Math.floor((lim - d0) / step) + 1));
      const mates = F.filter((g) => g !== f && g[key] === f[key] && !used.has(g.i))
        .sort((p, q) => (q.no !== f.no) - (p.no !== f.no) || AX.reduce((s, [a]) => s + (q[a] && q[a] === f[a]) - (p[a] && p[a] === f[a]), 0));
      const take = mates.slice(0, fit);
      const all = F.filter((g) => g !== f && g[key] === f[key]).length;
      // スマホで上（下）に2本並ぶときは、隣の列と重ならないよう横へ押し出す
      const pair = por && Math.abs(dx) > 0.01 && Math.abs(dx) < 0.5;
      const sx = (v, half) => (pair ? Math.sign(dx) * Math.max(Math.abs(v), half + 0.8) : v);
      const r = makeRay(ang, Math.max(d0 + (take.length - 0.4) * step, dLab + 6), COLORS[k % COLORS.length], lab, all, k); r.dLab = dLab; r.lx = sx(dx * dLab, lw / 2); r.ly = dy * dLab; rays.push(r);
      take.forEach((g, j) => { used.add(g.i); const d = d0 + j * step;
        place.set(g.i, { x: sx(dx * d, pw / 2), y: dy * d, z: 0, s: ps, o: 1, lo: 1, eo: 0, delay: 380 + k * 140 + j * 110 }); });
    });
    plates.forEach((p) => {
      if (p.f === f) { p.tgt = { x: 0, y: 0, z: 0, s: por ? 1.45 : 1.6, o: 1, lo: 1, eo: 1, delay: 0 }; }
      else if (place.has(p.f.i)) p.tgt = place.get(p.f.i);
      else { const h = p.home; p.tgt = { x: Math.cos(h.a) * h.r * vw * 1.4, y: Math.sin(h.a) * h.r * vh * 1.4, z: h.z, s: 1, o: 0.22, lo: 0, eo: 0, delay: 0, drift: true }; }
      p.t0 = now + (p.tgt.delay || 0);
    });
  }

  // 操作: かけらを押す → そのかけらが中心へ、炸裂がそのかけらの読みで組み直される
  const ray = new THREE.Raycaster(), mp = new THREE.Vector2();
  let hover = null;
  const pick = (e) => { mp.x = (e.clientX / W) * 2 - 1; mp.y = -(e.clientY / H) * 2 + 1; ray.setFromCamera(mp, cam);
    const hit = ray.intersectObjects(plates.filter((p) => p.cur.o > 0.5).map((p) => p.img))[0]; return hit ? hit.object.userData.f : null; };
  let down = null;
  cv.addEventListener("pointerdown", (e) => (down = [e.clientX, e.clientY]));
  cv.addEventListener("pointerup", (e) => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 10) return; const f = pick(e); if (!f) return;
    if (f === center) openView(f); else focus(f); });
  cv.addEventListener("pointermove", (e) => { if (e.pointerType !== "mouse") return; hover = pick(e); cv.style.cursor = hover ? "pointer" : "default"; par.x = (e.clientX / W - 0.5); par.y = (e.clientY / H - 0.5); });
  const par = { x: 0, y: 0 };

  function openView(f) { const v = document.getElementById("view"); v.querySelector("img").src = `f/${f.i}.jpg`;
    v.querySelector("figcaption").innerHTML = `<b>${f.nm}</b>${f.title}（${f.sport}）　この1秒（${f.t}）から映像を再生します。※試作では静止画`; v.classList.add("on"); }
  document.getElementById("view").onclick = (e) => e.currentTarget.classList.remove("on");
  function drawTrail() { const t = document.getElementById("trail"); t.innerHTML = history.map((f) => `<img src="f/${f.i}.jpg" data-i="${f.i}" title="${f.nm}">`).join("");
    t.querySelectorAll("img").forEach((im) => (im.onclick = () => { const f = F[+im.dataset.i]; if (f !== center) focus(f); })); }
  document.getElementById("again").onclick = () => { history = []; start(); };

  // 描画
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const k = 1 - Math.exp(-dt / 0.34);
    plates.forEach((p) => {
      if (!p.tgt) return;
      const t = p.tgt, c = p.cur;
      if (now >= p.t0) {
        if (t.drift) { p.home.a += p.home.sp * dt; t.x = Math.cos(p.home.a) * p.home.r * vw * 1.4; t.y = Math.sin(p.home.a) * p.home.r * vh * 1.4; }
        for (const key of ["x", "y", "z", "s", "o", "lo", "eo"]) c[key] += (t[key] - c[key]) * (key === "z" ? k * 0.9 : k);
      }
      const hv = hover === p.f && p.f !== center ? 1.12 : 1;
      p.grp.position.set(c.x, c.y, c.z); p.grp.scale.setScalar(c.s * hv);
      p.img.material.opacity = c.o; p.edge.material.opacity = c.eo;
      const lo = c.lo * Math.min(1, c.o); p.lab.style.opacity = lo;
      if (lo > 0.02) { const v = new THREE.Vector3(c.x, c.y - (PH / 2) * c.s * hv - 0.3, c.z).project(cam); p.lab.style.transform = `translate(-50%,0) translate(${((v.x + 1) / 2) * W}px,${((1 - v.y) / 2) * H + 3}px)`; }
      p.lab.classList.toggle("c", p.f === center);
    });
    rays = rays.filter((r) => {
      const age = (now - r.t0) / 1000;
      if (r.dead) { r.grow = Math.max(0, r.grow - dt * 3.2); if (r.grow <= 0.001) { scene.remove(r.g); scene.remove(r.lab); return false; } }
      else if (age > 0) r.grow = ease(age / 0.75);
      r.g.scale.set(Math.max(0.001, r.grow), 1, 1); r.sh.material.opacity = 0.34 * Math.min(1, r.grow * 1.4);
      r.lab.position.set(r.lx, r.ly, 1); r.lab.material.opacity = Math.max(0, (r.grow - 0.4) / 0.6);
      return true;
    });
    cam.position.x += (par.x * 6 - cam.position.x) * k * 0.5; cam.position.y += (-par.y * 4 - cam.position.y) * k * 0.5; cam.lookAt(0, 0, 0);
    R.render(scene, cam);
    requestAnimationFrame(frame);
  }
  function start() {
    const now = performance.now();
    plates.forEach((p) => { const h = p.home; p.cur = { x: Math.cos(h.a) * h.r * vw * 1.4, y: Math.sin(h.a) * h.r * vh * 1.4, z: -900, s: 1, o: 0, lo: 0, eo: 0 }; p.tgt = { x: p.cur.x, y: p.cur.y, z: h.z, s: 1, o: 0.22, lo: 0, eo: 0, drift: true }; p.t0 = now; });
    rays.forEach((r) => { scene.remove(r.g); scene.remove(r.lab); }); rays = [];
    setTimeout(() => focus(F.find((f) => f.nm === "倒れ込んだ敗者")), 1400);
  }
  addEventListener("resize", () => { size(); if (center) { const c = center; history.pop(); focus(c); } });
  start(); requestAnimationFrame(frame);
  window.__b = { focus: (i) => focus(F[i]), get center() { return center && center.i; }, plates, cam, F,
    screen: (i) => { const p = plates[i]; const v = new THREE.Vector3(); p.img.getWorldPosition(v); v.project(cam); return [(v.x + 1) / 2 * W, (1 - v.y) / 2 * H, p.cur.o]; } };
})();
</script>
