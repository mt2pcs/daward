const P_ = portrait;

// ---------- フォーカス

canvas.addEventListener("click", (e) => { if (state.phase !== "world") return; const it = hitCard(e.clientX, e.clientY); if (it) openFocus(it); else closeFocus(); });
function openFocus(it) {
