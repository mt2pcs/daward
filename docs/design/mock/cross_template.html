<meta charset="utf-8">
<title>熱の横断</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 熱の横断（UIモック・映像なし）。77本の瞬間は最初から熱の数の帯に割れた状態（402の熱）で、競技ごとの領域に浮かぶ。
   熱を1つ持つと、その熱の「見方」ごとに、別の競技の瞬間から響き合う熱の帯が抜け出して飛んでくる。見方を替えると別の競技から別の6つが来る。
   来た熱を押すとそれを持ち直す（ザッピング）。映像の代わりに動く板（本番は各熱の4秒の映像） */
:root{--ink:#050608;--paper:#f4f2ec;--dim:rgba(244,242,236,.62);--faint:rgba(244,242,236,.34);--hot:#f7ff3c;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(130% 95% at 50% 45%,transparent 60%,rgba(0,0,0,.55)),linear-gradient(180deg,rgba(0,0,0,.45),transparent 16%,transparent 70%,rgba(0,0,0,.75))}
.bar{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.mark{font-weight:900;font-size:11px;letter-spacing:.32em;white-space:nowrap}.mark em{font-style:normal;color:var(--hot)}
.count{font-size:10px;letter-spacing:.16em;color:var(--dim);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.count b{color:var(--paper);font-weight:700}
.close{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid rgba(244,242,236,.22);background:rgba(5,6,8,.4);color:var(--paper);font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
/* 空間に付く文字（3D の位置を画面へ写す） */
.lbl{position:fixed;left:0;top:0;z-index:4;pointer-events:none;will-change:transform;transition:opacity .35s}
.lbl .sp{font-size:10px;font-weight:900;letter-spacing:.18em;color:var(--hot);white-space:nowrap}
.lbl .ph{margin-top:3px;font-size:13px;font-weight:700;line-height:1.35;max-width:13em;text-shadow:0 1px 10px rgba(0,0,0,.8)}
.lbl .tt{margin-top:2px;font-size:10px;color:var(--dim);max-width:16em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl.center .ph{font-size:clamp(20px,2.4vw,30px);font-weight:900;max-width:16em;line-height:1.2}
.lbl.center .tt{font-size:12px}
.lbl.terr{font-size:clamp(11px,1.1vw,14px);font-weight:900;letter-spacing:.3em;color:rgba(244,242,236,.5);white-space:nowrap;transform-origin:0 0}
/* 下: 持っている熱の見方（ここを替えると、来る競技と瞬間が入れ替わる） */
.dock{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 14px;pointer-events:none}
.dock>*{pointer-events:auto}
.facets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:900px}
.facet{border:1px solid rgba(244,242,236,.26);background:rgba(5,6,8,.45);color:var(--paper);font-family:var(--display);font-weight:700;font-size:13px;border-radius:999px;padding:10px 15px;cursor:pointer;backdrop-filter:blur(8px);transition:background .25s,color .25s,border-color .25s}
.facet.on{background:var(--paper);color:#0a0a0a;border-color:var(--paper)}
.row{display:flex;gap:12px;align-items:center}
.pill{border:0;border-radius:999px;background:var(--hot);color:#0a0a0a;font-family:var(--display);font-weight:900;font-size:14px;letter-spacing:.04em;padding:13px 22px;cursor:pointer;white-space:nowrap}
.hint{font-size:12px;letter-spacing:.12em;color:var(--dim);text-align:center;line-height:1.7}
.cap{position:fixed;left:max(22px,6vw);right:22px;bottom:calc(env(safe-area-inset-bottom,0px) + 90px);z-index:6;pointer-events:none}
.cap .k{font-size:11px;font-weight:900;letter-spacing:.24em;color:var(--hot)}
.cap h2{margin:8px 0 0;font-size:clamp(28px,4.6vw,60px);font-weight:900;line-height:1.1;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.cap p{margin:10px 0 0;font-size:14px;color:var(--dim)}
.ch{display:inline-block;opacity:0;transform:translateY(.3em);filter:blur(8px);animation:ch .6s cubic-bezier(.2,.7,.2,1) forwards}@keyframes ch{to{opacity:1;transform:none;filter:none}}
.fade{animation:fade .6s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);z-index:20;width:min(360px,calc(100% - 40px));background:rgba(5,6,8,.85);border:1px solid rgba(244,242,236,.2);border-radius:18px;padding:20px;backdrop-filter:blur(12px);animation:fade .4s ease both}
.card .k{font-size:10px;letter-spacing:.24em;color:var(--hot);font-weight:900}.card h3{margin:8px 0 6px;font-size:22px;font-weight:900;line-height:1.3}.card p{margin:0 0 14px;font-size:12px;color:var(--dim);line-height:1.7}
.card .row{justify-content:flex-end}.ghost{border:1px solid rgba(244,242,236,.3);background:transparent;color:var(--paper);font-family:var(--display);font-weight:700;font-size:13px;border-radius:999px;padding:11px 16px;cursor:pointer}
@media (max-width:600px){.lbl .ph{font-size:11.5px;max-width:9.5em}.lbl .tt{display:none}.lbl.center .ph{font-size:19px;max-width:13em}.facet{font-size:12px;padding:9px 12px}.cap{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
</style>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div id="labels"></div>
<div class="bar"><div class="mark">DAZN <em>100</em> MOMENTS</div><div class="count" id="count"></div><button class="close" id="close" aria-label="戻る" hidden>←</button></div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
const D = __DATA__; // s=[競技] m=[題, 競技番号, 熱ids] c=[熱の名, 一文, 秒, 見方ごとの言い方[8], {次元: 響き合う熱ids}]
const V = (x, y, z) => new THREE.Vector3(x, y, z), reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---- 映像の代わりの板（夜の競技場と逆光の選手。uShot で画角が変わる。uWin は横の切り出し＝割れた帯） ----
const CARD_V = `varying vec2 vUv; varying float vD; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.); vD = -mv.z; gl_Position = projectionMatrix * mv; }`;

  float fd = smoothstep(.44,.40,q.y); float st = .5+.5*sign(sin(((q.x-.5)/(.75-q.y))*18.)); col = mix(col, hsv(uHue+.02,.55,.34)*(.75+.25*st)*(.55+.9*q.y), fd);
  float pose = floor(mod(sh*1.7,3.)), fx = .5+.2*sin(sh*1.3); vec2 fp = (p - vec2(fx*1.7778,.2))/.62; float lean = .12*sin(sh*2.7); fp = mat2(cos(lean),-sin(lean),sin(lean),cos(lean))*fp;
  float fdst = figure(fp, pose, t)*.62; col = mix(col, vec3(.006,.007,.01), smoothstep(.003,-.003,fdst)*.97); col += smoothstep(.007,0.,abs(fdst+.003))*smoothstep(-.2,.5,fp.y)*vec3(1.,.9,.72)*.4;
  col += base*.07*exp(-length(p-vec2(fx*1.7778,.75))*2.5); col *= 1.-.35*pow(length(uv-.5)*1.25,2.); col += (hash(uv*900.+fract(t)*31.)-.5)*.04; return col; }

const geo = new THREE.PlaneGeometry(1, 1);
function mkMesh(hue, seed) { const m = new THREE.Mesh(geo, new THREE.ShaderMaterial({ vertexShader: CARD_V, fragmentShader: CARD_F, transparent: true, depthWrite: false,
  blending: THREE.CustomBlending, blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  uniforms: { uOp: { value: 1 }, uTime: { value: seed * 3.1 }, uHue: { value: hue }, uSeed: { value: seed }, uShot: { value: 0 }, uDim: { value: 1 }, uHi: { value: 0 }, uWin: { value: new THREE.Vector2(0, 1) }, uSize: { value: new THREE.Vector2(1, 1) } } }));
  scene.add(m); return m; }
// ---- 世界: 競技ごとの領域（球の上）に、熱の数の帯に割れた瞬間が浮かぶ ----
const RAD = 120, terr = D.s.map((_, i) => { const n = D.s.length, y = 1 - (i + .5) / n * 2, r = Math.sqrt(1 - y * y), a = i * 2.39996; return V(Math.cos(a) * r, y * .75, Math.sin(a) * r).normalize().multiplyScalar(RAD); });

const moms = D.m.map((m, k) => { const s = m[1], same = D.m.filter((x) => x[1] === s), idx = same.indexOf(m), T = terr[s], nrm = T.clone().normalize();
  const u = V(0, 1, 0).cross(nrm).normalize(), v = nrm.clone().cross(u).normalize(); const rr = 9.5 * Math.sqrt(idx), aa = idx * 2.39996;
  return { k, s, pos: T.clone().addScaledVector(u, Math.cos(aa) * rr * 1.25).addScaledVector(v, Math.sin(aa) * rr * .8).addScaledVector(nrm, Math.sin(idx * 1.7) * 3) }; });
const strips = D.c.map((c, id) => { const [k, j] = momOf[id], n = D.m[k][2].length, sw = (MW - GAP * (n - 1)) / n;
  const mesh = mkMesh(SH[D.m[k][1]], k * 1.37 + .3); mesh.material.uniforms.uWin.value.set(j / n, (j + 1) / n);
  return { id, k, j, n, mesh, home: { x: -MW / 2 + sw / 2 + j * (sw + GAP), w: sw, h: MH }, st: null }; });
// 領域の名前（空間の中に付く）
const terrEls = D.s.map((s) => { const e = document.createElement("div"); e.className = "lbl terr"; e.textContent = s; document.getElementById("labels").appendChild(e); return e; });
// ---- カメラと状態 ----
const cr = V(0, 0, 0), cu = V(0, 0, 0), cf = V(0, 0, 0);
let yaw = 0.4, pitch = 0.12, dist = 205, camC = V(0, 0, 300), lookC = V(0, 0, 0), camT = V(0, 0, 200), lookT = V(0, 0, 0), now = 0;
let st = { k: "world" }, slots = [], prevSlots = [], facets = [];
const ui = { labels: document.getElementById("labels"), dock: document.getElementById("dock"), close: document.getElementById("close"), count: document.getElementById("count"), cap: document.getElementById("cap") };
const nC = D.c.length; let nL = 0; D.c.forEach((c) => Object.values(c[4]).forEach((l) => (nL += l.length)));
const countWorld = () => (ui.count.innerHTML = `<b>${D.m.length}</b> 瞬間 → <b>${nC}</b> の熱 · <b>${D.s.length}</b> 競技`);
const DIMHUE = [.13, .58, .95, .02, .75, .3, .48, .85];
// 持った熱の舞台: その熱の瞬間の外側に舞台を出し、カメラは外から見る
function stageBasis(id) { const M = moms[momOf[id][0]].pos, out = M.clone().normalize(); const S0 = M.clone().addScaledVector(out, 14);
  const f = out.clone().negate(), r = f.clone().cross(V(0, 1, 0)).normalize(), u = r.clone().cross(f).normalize(); return { S0, out, r, u }; }
function layout() { // 中心＋響き合う6つの置き場所（画面の座標系で）。縦画面は中心を上、6つを下に2列
  if (portrait()) return { center: [0, 9.5, 1], sl: [[-4.35, -1.5], [4.35, -1.5], [-4.35, -8.6], [4.35, -8.6], [-4.35, -15.7], [4.35, -15.7]].map(([x, y]) => [x, y, .46]), dist: 44 };
  return { center: [0, 2.2, 1.05], sl: [[-19.5, 6.5], [-19.5, -.5], [-19.5, -7.5], [19.5, 6.5], [19.5, -.5], [19.5, -7.5]].map(([x, y]) => [x, y, .4]), dist: 40 }; }
const toWorld = (B, x, y, z = 0) => B.S0.clone().addScaledVector(B.r, x).addScaledVector(B.u, y).addScaledVector(B.out, z);
function hold(id, d) { const c = D.c[id]; facets = Object.keys(c[4]).map(Number); if (d === undefined || !facets.includes(d)) d = facets[0];
  prevSlots = slots; const B = stageBasis(id), L = layout(); const partners = d === undefined ? [] : c[4][d].slice(0, 6);
  slots = [{ id, at: toWorld(B, L.center[0], L.center[1], 2), s: L.center[2], role: "center" }, ...partners.map((pid, i) => ({ id: pid, at: toWorld(B, L.sl[i][0], L.sl[i][1], -1 - (i % 3) * .6), s: L.sl[i][2], role: "p", i }))];
  // 前の舞台にいて、今回もいる熱は動き続ける。いなくなる熱は自分の瞬間へ帰る
  for (const s of strips) s.st = null; slots.forEach((sl, n) => { const s = strips[sl.id]; s.st = { ...sl, t0: now + (sl.role === "center" ? 0 : .25 + n * .09), from: s.mesh.position.clone(), fromS: s.mesh.scale.clone(), win0: s.mesh.material.uniforms.uWin.value.clone() }; });
  for (const p of prevSlots) { const s = strips[p.id]; if (!s.st) s.back = { t0: now, from: s.mesh.position.clone(), fromS: s.mesh.scale.clone(), win0: s.mesh.material.uniforms.uWin.value.clone() }; }
  const look = toWorld(B, 0, portrait() ? -3 : 0); camT.copy(look).addScaledVector(B.out, L.dist); lookT.copy(look);
  st = { k: "hold", id, d }; ui.close.hidden = false; renderDock(); }
function world() { prevSlots = slots; slots = []; for (const p of prevSlots) { const s = strips[p.id]; s.st = null; s.back = { t0: now, from: s.mesh.position.clone(), fromS: s.mesh.scale.clone(), win0: s.mesh.material.uniforms.uWin.value.clone() }; }
  st = { k: "world" }; ui.close.hidden = true; dist = 205; renderDock(); countWorld(); }
function renderDock() { ui.cap.innerHTML = "";
  if (st.k === "world") { ui.dock.innerHTML = `<div class="hint">77本のハイライトを、熱の数だけ割ってあります。<br>どれか一つの熱に触れてください</div>`; return; }
  if (st.k === "hold") { const c = D.c[st.id];
    ui.dock.innerHTML = `<div class="facets">${facets.map((d) => `<button class="facet ${d === st.d ? "on" : ""}" data-d="${d}">${c[3][d]}</button>`).join("")}</div><div class="row"><button class="pill" data-act="play">▶ この熱で通して観る</button></div>`;
    const tot = facets.reduce((s, d) => s + c[4][d].length, 0), sports = new Set(c[4][st.d].map((i) => D.m[momOf[i][0]][1])).size;
    ui.count.innerHTML = `${nC} の熱を照らし合わせ · <b>${sports}</b> 競技から <b>${c[4][st.d].length}</b>`; } }
ui.dock.addEventListener("click", (e) => { const f = e.target.closest("[data-d]"); if (f && st.k === "hold") { hold(st.id, +f.dataset.d); return; }
  const a = e.target.closest("[data-act]")?.dataset.act; if (a === "play") play(); if (a === "again") hold(st.id, st.d); });
ui.close.onclick = () => { if (st.k === "play") { clearTimeout(playTimer); hold(st.id, st.d); } else world(); };
// 通して観る: カメラが舞台の熱を順に画面いっぱいで捉える（本番は各熱の4秒がつながる）。最後にシェア
let playTimer = 0;
function play() { const seq = slots.slice(); let i = 0; st = { ...st, k: "play" }; ui.dock.innerHTML = "";
  const c0 = D.c[seq[0].id];
  const show = () => { if (i >= seq.length) { share(c0[3][st.d]); return; } const sl = seq[i], s = strips[sl.id], c = D.c[sl.id], m = D.m[momOf[sl.id][0]];
    const f = cam.getWorldDirection(V(0, 0, 0)), tFill = Math.tan((cam.fov * Math.PI) / 360), w = 16 * sl.s * MW / 16 * (16 / 9) ; const h = MW * sl.s * 9 / 16 * (16 / 9) / 2;
