<title>熱狂ザッピング UIモック</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>

.top>*{pointer-events:auto}
.brand{font-weight:900;font-size:12px;letter-spacing:.12em}.brand em{font-style:normal;color:var(--accent)}
.mocktag{font-size:10px;color:var(--mute);border:1px solid var(--line);padding:3px 8px;border-radius:999px}
.back{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--fg);font-size:18px;cursor:pointer}
.hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 52px);text-align:center;font-size:13px;color:var(--mute);z-index:5;pointer-events:none;padding:0 16px;transition:opacity .4s}
.hint b{color:var(--fg)}
.zoom{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:6;font-size:10px;color:var(--mute)}
.zoom i{width:3px;height:120px;background:var(--line);border-radius:3px;position:relative;display:block}
.zoom i::after{content:"";position:absolute;left:-4px;width:11px;height:11px;border-radius:50%;background:var(--accent);top:var(--z,50%);transform:translateY(-50%)}
/* 下の欄 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.dock>*{pointer-events:auto}
.dest{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dest button{background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;cursor:pointer;display:flex;gap:6px;align-items:center}
.dest button i{font-style:normal;color:var(--accent);display:inline-block}
.word{display:flex;gap:8px;width:min(520px,100%)}
.word input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--fg);font-size:16px;padding:11px 14px;border-radius:999px;outline:none}
.word input:focus{border-color:var(--accent)}
.word button,.btn.go{background:var(--accent);color:#000;border:0;font-weight:900;border-radius:999px;padding:0 18px;cursor:pointer;font-size:14px}
.sheet{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;backdrop-filter:blur(10px);position:relative;animation:up .3s ease both}
.sheet .x{position:absolute;right:8px;top:6px;background:none;border:0;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.sheet .k{font-size:10px;letter-spacing:.14em;color:var(--mute)}
.sheet h2{font-family:var(--display);font-size:20px;line-height:1.3;margin:4px 28px 2px 0;text-wrap:balance}
.sheet p{font-size:12px;color:var(--mute);margin:2px 0 0;line-height:1.6}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:700;padding:10px 14px;border-radius:999px;cursor:pointer}
.btn.go{padding:10px 18px;margin-left:auto}
.chips{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}

.chips small{flex:0 0 auto;font-size:10px;color:var(--mute);align-self:center}

.player .prog{position:absolute;left:0;top:0;height:3px;background:var(--accent);animation:prog linear both}
.player .top2{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center}.player .top2 b{color:var(--accent);font-size:16px}.player .top2 span{display:block;font-size:11px;color:var(--mute)}
.strip{display:flex;gap:6px;overflow-x:auto;max-width:100%;scrollbar-width:none}.strip button{flex:0 0 auto;width:58px;height:33px;border-radius:5px;border:2px solid transparent;background:var(--grad);opacity:.5;cursor:pointer}.strip button.on{opacity:1;border-color:var(--accent)}
.navl,.navr{position:absolute;top:15%;bottom:35%;width:30%;background:none;border:0;cursor:pointer}.navl{left:0}.navr{right:0}

.count{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);display:flex;justify-content:center;gap:clamp(14px,4vw,40px);z-index:8;pointer-events:none}
.count div{display:flex;flex-direction:column;align-items:center}.count b{font-size:clamp(24px,4vw,44px);font-weight:900;font-variant-numeric:tabular-nums;line-height:1}.count span{font-size:10px;color:var(--mute);margin-top:4px}
.title{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 56px);text-align:center;z-index:8;pointer-events:none;padding:0 16px}
.title small{display:block;font-size:11px;color:var(--mute)}.title b{font-family:var(--display);font-size:clamp(20px,3vw,32px)}
.found{position:fixed;left:0;right:0;top:36%;text-align:center;z-index:9;animation:in .6s ease both;padding:0 16px}
.found small{display:block;font-size:12px;color:var(--mute)}.found b{display:block;font-family:var(--display);font-size:clamp(32px,6vw,68px);margin:6px 0 14px;text-wrap:balance}
.end{position:fixed;inset:0;z-index:35;background:rgba(5,6,10,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:0 20px;animation:in .5s ease both}
.end b{font-family:var(--display);font-size:clamp(30px,6vw,60px)}.end p{color:var(--mute);font-size:13px;margin:0}
.toast{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:9;pointer-events:none;font-family:var(--display);font-size:clamp(28px,5vw,52px);font-weight:900;animation:toast 2.6s ease both}
.toast small{display:block;font-family:var(--body);font-size:12px;color:var(--mute);font-weight:400}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes prog{from{width:0}to{width:100%}}@keyframes toast{0%{opacity:0;letter-spacing:.3em}15%{opacity:1;letter-spacing:.02em}75%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important}}
