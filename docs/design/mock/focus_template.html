<meta charset="utf-8">
<title>熱狂ピント送り</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 映画のカメラで観る 100 MOMENTS（UIモック・映像なし）。瞬間は奥行きの中に1本ずつ浮かび、ピントの合った1本だけがはっきり見える。
   映像の代わりに、照明・観客・選手の影が動く板を描く（本番はここに各瞬間の映像が入る） */
:root{
  --ink:#050608; --paper:#f4f2ec; --dim:rgba(244,242,236,.62); --faint:rgba(244,242,236,.34); --hot:#f7ff3c;
  --display:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--display);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:none;-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(130% 95% at 50% 40%,transparent 58%,rgba(0,0,0,.5)),linear-gradient(180deg,rgba(0,0,0,.42),transparent 18%,transparent 50%,rgba(0,0,0,.82))}
.bar{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 16px) max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));pointer-events:none}
.bar>*{pointer-events:auto}
.mark{font-weight:900;font-size:11px;letter-spacing:.32em;white-space:nowrap}.mark em{font-style:normal;color:var(--hot)}
.tag{font-size:10px;letter-spacing:.12em;color:var(--faint);text-align:right}
.close{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid rgba(244,242,236,.22);background:rgba(5,6,8,.35);color:var(--paper);font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}
/* 映画のタイトル */
.slate{position:fixed;left:max(22px,env(safe-area-inset-left,0px),6vw);right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + clamp(96px,15vh,150px));z-index:5;pointer-events:none}
.slate .kick{display:flex;gap:14px;align-items:baseline;font-size:11px;letter-spacing:.28em;color:var(--dim);font-weight:700}
.slate .kick b{color:var(--paper);font-variant-numeric:tabular-nums;letter-spacing:.12em}
.slate .kick .tc{color:var(--hot);letter-spacing:.14em}
.slate h1{margin:10px 0 0;font-weight:900;font-size:clamp(34px,6vw,88px);line-height:1.06;letter-spacing:.01em;max-width:14em;text-wrap:balance;text-shadow:0 2px 30px rgba(0,0,0,.45)}
.slate p{margin:14px 0 0;max-width:30em;font-size:clamp(14px,1.4vw,18px);line-height:1.75;color:var(--paper);font-weight:500;opacity:.92;text-shadow:0 1px 14px rgba(0,0,0,.6)}
.ch{display:inline-block;opacity:0;transform:translateY(.35em);filter:blur(10px);animation:ch .7s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes ch{to{opacity:1;transform:none;filter:none}}
.fade{animation:fade .8s ease both}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.out .ch,.out p,.out .kick{animation:out .3s ease forwards}@keyframes out{to{opacity:0;filter:blur(8px)}}
/* 下の操作 */
.cue{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);z-index:6;display:flex;justify-content:center;align-items:center;gap:14px;padding:0 18px;pointer-events:none}
.cue>*{pointer-events:auto}
.hint{font-size:11px;letter-spacing:.16em;color:var(--faint);display:flex;gap:14px;align-items:center;white-space:nowrap}
.hint i{font-style:normal;display:inline-block;width:26px;height:1px;background:var(--faint)}
.pill{border:0;border-radius:999px;background:var(--hot);color:#0a0a0a;font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.04em;padding:14px 26px;cursor:pointer;box-shadow:0 10px 40px rgba(247,255,60,.16);transition:transform .2s;white-space:nowrap}
.pill:active{transform:scale(.97)}
.ghost{border:1px solid rgba(244,242,236,.3);background:rgba(5,6,8,.35);color:var(--paper);font-family:var(--display);font-weight:700;font-size:13px;border-radius:999px;padding:13px 18px;cursor:pointer;backdrop-filter:blur(8px);white-space:nowrap}
.dots{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:6;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.dots span{width:4px;height:4px;border-radius:50%;background:var(--faint);transition:all .35s}.dots span.on{background:var(--hot);height:18px;border-radius:3px}
/* 再生の目盛り（観ているあいだ）。熱に分かれると、熱のあった時刻に印が立つ */
.hud{position:fixed;left:max(22px,env(safe-area-inset-left,0px),6vw);right:max(22px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:6;display:flex;align-items:center;gap:12px;font-size:10px;letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s;pointer-events:none}
.hud.on{opacity:1}
.track{position:relative;flex:1;height:2px;background:rgba(244,242,236,.16);border-radius:2px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:var(--paper);border-radius:2px}
.track .tk{position:absolute;top:-4px;width:2px;height:10px;margin-left:-1px;background:var(--faint);border-radius:1px;transform:scaleY(0);transition:transform .4s cubic-bezier(.2,.8,.2,1),background .3s}
.track .tk.show{transform:none}.track .tk.on{background:var(--hot);height:14px;top:-6px}
.toast{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);z-index:20;background:rgba(5,6,8,.78);border:1px solid rgba(244,242,236,.2);padding:14px 18px;border-radius:14px;font-size:13px;line-height:1.6;text-align:center;backdrop-filter:blur(10px);animation:fade .3s ease both;max-width:min(340px,calc(100% - 40px))}
@media (max-width:600px){.slate{bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}.slate h1{font-size:clamp(30px,8.6vw,42px)}.slate p{font-size:14px}.hint{display:none}.dots{right:8px}.tag{display:none}}
@media (prefers-reduced-motion: reduce){.ch{animation-duration:.01s}}
</style>
<canvas id="gl"></canvas>
<div class="vig"></div>
<div class="bar"><div class="mark">DAZN <em>100</em> MOMENTS</div><div class="tag">UIモック — 映像の代わりに動く板</div><button class="close" id="close" aria-label="戻る" hidden>←</button></div>
<div class="slate" id="slate"></div>
<div class="dots" id="dots"></div>
<div class="cue" id="cue"></div>
<div class="hud" id="hud"><span id="tc">00:00</span><div class="track" id="track"><div class="fill" id="fill"></div></div></div>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
const D = __DATA__; // m=[題, 競技, 熱ids] c=[熱の名, 一文, 主な次元, 映像内の秒]
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const V = (x, y, z) => new THREE.Vector3(x, y, z);
// ---- 舞台 ----
const cv = document.getElementById("gl"), R = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); R.setPixelRatio(Math.min(devicePixelRatio, 2)); R.setClearColor(0x050608, 1);

const CARD_V = `varying vec2 vUv; varying float vD; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.); vD = -mv.z; gl_Position = projectionMatrix * mv; }`;

uniform float uFocus, uRange, uOp, uTime, uLive, uHue, uSeed, uShot, uBlur, uDim; uniform vec2 uWin, uSize;

  vec2 hs = uSize*.5, q = abs((vUv-.5)*uSize); float r = .32; float d = length(max(q-(hs-r),0.)) - r;

  c *= (1. - coc*.4)*uDim;

const cardGeo = new THREE.PlaneGeometry(16, 9);

  const mesh = new THREE.Mesh(cardGeo, mat); scene.add(mesh); return mesh; }
// 瞬間の並び: 奥へ向かって左右（縦画面は上下）に互い違いに1本ずつ。いま見ている1本の奥に次、手前に前
const momentPos = (k) => portrait() ? V(Math.sin(k * .9) * 1.6, k * 11, -k * 13) : V((k % 2 ? -1 : 1) * 8.5, ((k % 3) - 1) * 2.6, -k * 13);
const cards = D.m.map((m, k) => ({ mesh: mkCard(sportHue[m[1]], k * 1.37 + .3), k }));
const place = () => cards.forEach((c) => { c.mesh.position.copy(momentPos(c.k)); c.mesh.rotation.y = portrait() ? 0 : (c.k % 2 ? 1 : -1) * .12; });
// 縦画面で観るとき: 映像は切らずに帯で見せ、同じ映像をぼかして背景に敷く
const backdrop = mkCard(0, 0); backdrop.material.uniforms.uBlur.value = 1; backdrop.material.uniforms.uDim.value = .55; backdrop.material.uniforms.uOp.value = 0; backdrop.renderOrder = -1;
// ボケの粒（空間に漂う 402 の熱）: ピントから外れるほど大きく淡い円
const NB = 700, bp = new Float32Array(NB * 3), bc = new Float32Array(NB * 3), bs = new Float32Array(NB);
const bokehBase = []; for (let i = 0; i < NB; i++) { bokehBase.push([Math.random() * D.m.length, (Math.random() - .5), (Math.random() - .5), (Math.random() - .5)]);
  const col = new THREE.Color().setHSL(Math.random() < .5 ? .11 : HUES[i % 8], .7, .62).lerp(new THREE.Color("#fff3df"), .5); bc.set([col.r, col.g, col.b], i * 3); bs[i] = .35 + Math.random() * 1.1; }

const bgeo = new THREE.BufferGeometry(); bgeo.setAttribute("position", new THREE.BufferAttribute(bp, 3)); bgeo.setAttribute("color", new THREE.BufferAttribute(bc, 3)); bgeo.setAttribute("s", new THREE.BufferAttribute(bs, 1));
const bokeh = new THREE.Points(bgeo, new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: { uFocus: { value: 30 }, uPx: { value: R.getPixelRatio() }, uOp: { value: 1 } },
  vertexShader: `attribute float s; attribute vec3 color; uniform float uFocus, uPx, uOp; varying vec3 vC; varying float vA; void main(){ vec4 mv = modelViewMatrix * vec4(position,1.); float d = -mv.z; float coc = clamp(abs(d - uFocus) / 24.0, 0.0, 1.8);

const resize = () => { R.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.fov = portrait() ? 58 : 40; cam.updateProjectionMatrix(); place(); placeBokeh(); if (st) go(st, true); };
// ---- 状態 ----
const ui = { slate: document.getElementById("slate"), cue: document.getElementById("cue"), dots: document.getElementById("dots"), close: document.getElementById("close"), hud: document.getElementById("hud"), track: document.getElementById("track"), fill: document.getElementById("fill"), tc: document.getElementById("tc") };
let st = null;
let heats = []; // 分解したときの熱の板
let focusMesh = null, focusC = 60, focusFrom = 0, camT = V(0, 0, 0), lookT = V(0, 0, 0), camC = V(0, 0, 60), lookC = V(0, 0, 0), now = 0, px = 0, py = 0, playT = 0, clipLen = 30;
const chars = (s, delay = 0) => [...s].map((ch, i) => `<span class="ch" style="animation-delay:${delay + i * 28}ms">${ch === " " ? "&nbsp;" : ch}</span>`).join("");
let slateKey = "";
function slate(key, kick, title, line) { if (key === slateKey) return; slateKey = key; ui.slate.classList.add("out");
  setTimeout(() => { ui.slate.classList.remove("out"); ui.slate.innerHTML = `<div class="kick fade">${kick}</div><h1>${chars(title, 120)}</h1>${line ? `<p class="fade" style="animation-delay:${220 + title.length * 28}ms">${line}</p>` : ""}`; }, reduce ? 0 : 240); }
const cue = (html) => { if (ui.cue.dataset.h !== html) { ui.cue.dataset.h = html; ui.cue.innerHTML = html; } };
function dots(n, i) { const m = Math.min(n, 9), at = n <= 9 ? i : Math.round((i / (n - 1)) * (m - 1)); ui.dots.innerHTML = Array.from({ length: m }, (_, j) => `<span class="${j === at ? "on" : ""}"></span>`).join(""); }
const pad = (n) => String(n).padStart(2, "0"), mmss = (s) => `${pad(Math.floor(s / 60))}:${pad(Math.floor(s % 60))}`;
// 構図: 見る物の手前にカメラ、ピントはその物に（少し遅れて送る）
const fillDist = () => { const t = Math.tan((cam.fov * Math.PI) / 360); return portrait() ? 8 / (t * cam.aspect) * 1.0 : Math.max(4.5 / t, 8 / (t * cam.aspect)) * .985; };
function frame(mesh, mode, at, sc, ry) { const p = at || mesh.position, s = sc || mesh.scale.y; let dist, dy;

  else { dist = (portrait() ? 34 : 22) * s; dy = (portrait() ? -4.5 : -1.5) * s; }

  camT.copy(p).addScaledVector(side, dist).add(V(0, mode === "fill" ? 0 : .9, 0)); lookT.copy(p).add(V(0, dy, 0)); focusMesh = mesh; focusFrom = now + (reduce ? 0 : .14); }
function go(s, silent) { const prev = st || {}; st = s; ui.close.hidden = st.k === "browse";
